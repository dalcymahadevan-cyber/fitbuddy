<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FitBuddy AI - Generator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 rounded shadow" style="max-width: 600px;">
        <h2 class="mb-4 text-center text-primary">FitBuddy AI Fitness Generator</h2>
        <form action="/generate" method="post">
            <div class="mb-3">
                <label>Name</label>
                <input type="text" name="name" class="form-control" required placeholder="e.g. Rahul">
            </div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label>Age</label>
                    <input type="number" name="age" class="form-control" required placeholder="25">
                </div>
                <div class="col-md-6 mb-3">
                    <label>Weight (kg)</label>
                    <input type="number" name="weight" class="form-control" required placeholder="70">
                </div>
            </div>
            <div class="mb-3">
                <label>Fitness Goal</label>
                <select name="goal" class="form-select">
                    <option value="Weight Loss">Weight Loss</option>
                    <option value="Muscle Gain">Muscle Gain</option>
                    <option value="General Wellness">General Wellness</option>
                </select>
            </div>
            <div class="mb-3">
                <label>Workout Intensity</label>
                <select name="intensity" class="form-select">
                    <option value="low">Low</option>
                    <option value="medium" selected>Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Generate My 7-Day Plan</button>
        </form>
    </div>
</body>
</html>
